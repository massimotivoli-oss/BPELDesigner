name: bpeldesigner
services:
  participants:
    platform: linux/amd64
    build:
      context: .
      target: participants
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:8081/participants/hello?wsdl"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    init: true
  ode:
    platform: linux/amd64
    build:
      context: .
      target: ode
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./processes:/processes:ro
      - ode-state:/opt/tomcat/webapps/ode/WEB-INF/derby-jpadb
      - ode-work:/opt/tomcat/webapps/ode/WEB-INF/work
      - ode-processes:/opt/tomcat/webapps/ode/WEB-INF/processes
    depends_on:
      participants:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:8080/ode/processes/Orchestrator?wsdl"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    init: true
  ide:
    platform: linux/amd64
    build:
      context: .
      target: ide
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - .:/project
      - eclipse-workspace:/workspace
    shm_size: 512mb
    healthcheck:
      test: [CMD, python3, /opt/tools/ide-health.py]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    init: true
  test:
    platform: linux/amd64
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      ODE_URL: http://ode:8080
      PARTICIPANT_URL: http://participants:8081
    depends_on:
      ode:
        condition: service_healthy
    init: true
volumes:
  eclipse-workspace:
  ode-state:
  ode-work:
  ode-processes:
