name: Docker BPEL integration
on: [push, pull_request, workflow_dispatch]
jobs:
  orchestration:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check.py
      - run: python3 scripts/check-docker-deploy.py
      - name: Allow the desktop user to edit the bind-mounted checkout
        run: sudo chown -R 1000:1000 processes services
      - name: Build the servers and the Eclipse desktop, wait for real editor startup
        run: bash scripts/docker.sh up
      - name: SOAP and graphical editor checks
        run: bash scripts/docker.sh test
      - name: Check restart with persistent volumes
        run: bash scripts/docker.sh restart-test
      - name: Recreate containers while retaining named volumes
        run: bash scripts/docker.sh recreate-test
      - if: always()
        run: bash scripts/collect-docker-evidence.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-evidence
          path: artifacts/
      - if: always()
        run: docker compose down
