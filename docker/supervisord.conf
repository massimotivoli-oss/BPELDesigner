[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 1440x1000x24 -ac -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/tmp/xvfb.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/xvfb-error.log
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/bin/bash -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done; exec fluxbox'
priority=20
autorestart=true
stdout_logfile=/tmp/fluxbox.log
redirect_stderr=true

[program:vnc]
command=/bin/bash -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done; exec x11vnc -display :0 -forever -shared -nopw -localhost -rfbport 5900'
priority=30
autorestart=true
stdout_logfile=/tmp/vnc.log
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true
stdout_logfile=/tmp/novnc.log
redirect_stderr=true

[program:eclipse]
# Avoid GTK printer discovery blocking the SWT UI in a headless container.
command=/bin/bash -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done; exec /opt/eclipse/eclipse -clean -nosplash -consoleLog -vm /opt/java/openjdk/bin/java -data /workspace -vmargs -Xms256m -Xmx1536m -Dorg.eclipse.swt.internal.gtk.cairoGraphics=false -Dorg.eclipse.swt.internal.gtk.disablePrinting=true'
priority=50
# Fail visibly; do not hide an Eclipse crash behind an endless restart loop.
autorestart=false
startsecs=20
stdout_logfile=/tmp/eclipse-launcher.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/eclipse-launcher-error.log
stderr_logfile_maxbytes=0
